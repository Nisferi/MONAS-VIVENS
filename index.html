<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0805" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <title>MONAS VIVENS</title>
  <script src="https://telegram.org/js/telegram-web-app.js" defer></script>
  <style>
    :root {
      --bg: #0b0805;
      --panel: rgba(26, 18, 11, 0.92);
      --line: #5a4630;
      --ochre: #d99840;
      --gold: #ffd966;
      --amber: #ff8c1a;
      --turquoise: #00e5cf;
      --text: #f0dba8;
      --dim: #9a8260;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: Georgia, 'Times New Roman', serif;
      overflow: hidden;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }
    #field {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      cursor: grab;
    }
    #field.dragging { cursor: grabbing; }

    /* Верхняя полоса: имя + статистика */
    #topbar {
      position: fixed;
      top: env(safe-area-inset-top, 0);
      left: env(safe-area-inset-left, 0);
      right: env(safe-area-inset-right, 0);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 12px;
      pointer-events: none;
    }
    #title {
      font-variant: small-caps;
      letter-spacing: 0.25em;
      font-size: 13px;
      color: var(--ochre);
      text-shadow: 0 1px 4px #000;
    }
    #stats {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 6px 14px;
      font-size: 13px;
      color: var(--gold);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 5px 14px;
      max-width: 70vw;
    }
    #energystat.low { color: #ff5a3c; }
    #stagestat { color: var(--ochre); font-variant: small-caps; }

    /* Правая колонка: управление видом и временем */
    #sidebtns {
      position: fixed;
      right: calc(10px + env(safe-area-inset-right, 0));
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    #lensbtns {
      position: fixed;
      left: calc(10px + env(safe-area-inset-left, 0));
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .iconbtn.mainbtn {
      border-color: var(--gold);
      font-size: 22px;
    }
    /* Меню в игре и кнопка посадки */
    #title { margin-left: 52px; }
    #menubtn {
      position: fixed;
      top: calc(8px + env(safe-area-inset-top, 0px));
      left: calc(10px + env(safe-area-inset-left, 0px));
      z-index: 5;
    }
    #plantwrap {
      position: fixed;
      bottom: calc(64px + env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translateX(-50%);
      display: none;
      align-items: center;
      gap: 8px;
      z-index: 6;
    }
    #plantwrap.show { display: flex; }
    #plantbtn {
      border-radius: 12px;
      border-color: var(--gold);
      color: var(--gold);
      font-size: 16px;
      padding: 13px 22px;
      box-shadow: 0 2px 14px rgba(0, 0, 0, 0.5);
    }
    .nudgebtn {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      font-size: 17px;
      background: var(--panel);
    }

    /* Гид первой партии */
    #goals {
      position: fixed;
      left: calc(10px + env(safe-area-inset-left, 0px));
      bottom: calc(56px + env(safe-area-inset-bottom, 0px));
      display: none;
      flex-direction: column;
      gap: 4px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 11px;
      color: var(--ochre);
      max-width: 230px;
      pointer-events: none;
    }
    #goals.show { display: flex; }
    .goalrow.done { color: var(--turquoise); opacity: 0.8; }

    /* Главное меню */
    .menulist {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 12px;
      text-align: left;
    }
    .menuitem {
      display: flex;
      align-items: center;
      gap: 14px;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 15px;
      text-align: left;
    }
    .menuicon { font-size: 22px; min-width: 30px; text-align: center; }
    .menutext { display: flex; flex-direction: column; gap: 2px; }
    .menutext small { color: var(--ochre); font-size: 11px; line-height: 1.3; }

    #morebtns {
      display: none;
      flex-direction: column;
      gap: 8px;
    }
    #morebtns.show { display: flex; }
    #paneltabs {
      display: flex;
      justify-content: center;
      gap: 6px;
      padding-bottom: 6px;
    }
    .paneltab {
      border-radius: 8px;
      font-size: 12px;
      padding: 6px 14px;
      opacity: 0.6;
    }
    .paneltab.active {
      opacity: 1;
      border-color: var(--turquoise);
      color: var(--turquoise);
    }
    #journal {
      max-height: 30vh;
      overflow-y: auto;
      font-size: 12px;
      color: var(--text);
    }
    .journalrow { padding: 3px 4px; border-bottom: 1px solid var(--line); opacity: 0.9; }
    #phispark { opacity: 0.9; }
    button {
      background: var(--panel);
      color: var(--gold);
      border: 1px solid var(--line);
      font-family: inherit;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }
    button:hover { border-color: var(--gold); }
    button:active { color: var(--turquoise); }
    .iconbtn {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      font-size: 19px;
      line-height: 1;
    }
    .iconbtn.active {
      border-color: var(--turquoise);
      color: var(--turquoise);
    }
    .iconbtn.locked {
      opacity: 0.35;
    }
    #phistat { color: var(--turquoise); font-weight: bold; }
    #phibreak {
      font-size: 11px;
      color: var(--ochre);
      text-align: center;
      padding-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #toast {
      position: fixed;
      top: 52px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--panel);
      border: 1px solid var(--gold);
      border-radius: 10px;
      color: var(--gold);
      font-size: 14px;
      padding: 10px 18px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s;
      max-width: min(90vw, 480px);
      text-align: center;
    }
    #toast.show { opacity: 1; }

    /* Голоса древних — только вверху, под капсулой статов */
    #quote {
      position: fixed;
      top: calc(52px + env(safe-area-inset-top, 0px));
      left: 50%;
      transform: translateX(-50%);
      width: min(92vw, 640px);
      text-align: center;
      font-size: 12px;
      font-style: italic;
      line-height: 1.5;
      color: rgba(217, 152, 64, 0.85);
      opacity: 0;
      transition: opacity 1.2s;
      pointer-events: none;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
    }
    #quote.show { opacity: 1; }
    #quote cite {
      display: block;
      font-style: normal;
      font-size: 10px;
      letter-spacing: 0.12em;
      color: rgba(255, 217, 102, 0.6);
      margin-top: 2px;
    }
    #budgetstat { color: var(--turquoise); font-weight: bold; }
    #breathstat { color: var(--gold); font-weight: bold; }
    #breathstat.low { color: #ff5a3c; }

    /* Скраббер времени (линза Разума) */
    #scrub {
      position: fixed;
      bottom: calc(56px + env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translateX(-50%);
      display: none;
      align-items: center;
      gap: 10px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 6px 14px;
      font-size: 12px;
      color: var(--turquoise);
    }
    #scrub.show { display: flex; }
    #scrub input { width: min(40vw, 260px); accent-color: var(--turquoise); }
    #scrub output { min-width: 3.5em; text-align: right; color: var(--turquoise); }
    @media (max-width: 520px) {
      #quote { font-size: 11px; top: calc(64px + env(safe-area-inset-top, 0px)); }
      #lensbtns { gap: 6px; }
    }

    /* Экраны старта и финала */
    #screen {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(11, 8, 5, 0.9);
      z-index: 10;
      padding: 16px;
      overflow-y: auto;
    }
    #screen.show { display: flex; }
    #screen .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 22px 24px calc(22px + env(safe-area-inset-bottom, 0px));
      width: min(560px, 94vw);
      max-height: 92vh;
      overflow-y: auto;
      text-align: center;
    }
    #screen h1 {
      font-variant: small-caps;
      letter-spacing: 0.18em;
      font-size: 22px;
      color: var(--gold);
      margin-bottom: 8px;
    }
    #screen .sub { font-size: 13px; color: var(--ochre); margin-bottom: 10px; }
    #screen .best { font-size: 13px; color: var(--turquoise); margin-bottom: 6px; }
    #screen .score { font-size: 17px; color: var(--turquoise); margin: 8px 0; }
    #screen .chronicle {
      text-align: left;
      white-space: pre-wrap;
      font-family: inherit;
      font-size: 13px;
      line-height: 1.55;
      color: var(--text);
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px 14px;
      margin: 10px 0;
    }
    .chipgroup { margin: 12px 0 4px; text-align: left; }
    .chiptitle {
      font-variant: small-caps;
      letter-spacing: 0.12em;
      color: var(--ochre);
      font-size: 13px;
      margin-bottom: 6px;
    }
    .chips { display: flex; gap: 8px; flex-wrap: wrap; }
    .chip {
      flex: 1 1 30%;
      min-width: 130px;
      border-radius: 10px;
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 13px;
      text-align: center;
    }
    .chip small { color: var(--ochre); font-size: 11px; line-height: 1.3; }
    .chip.active { border-color: var(--turquoise); color: var(--turquoise); }
    .seedrow {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: center;
      margin: 14px 0 6px;
      font-size: 13px;
      flex-wrap: wrap;
    }
    .seedrow input {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--line);
      color: var(--gold);
      font-family: inherit;
      font-size: 14px;
      padding: 8px 10px;
      border-radius: 8px;
      width: 180px;
    }
    button.primary {
      margin-top: 12px;
      border-radius: 10px;
      font-size: 16px;
      padding: 12px 28px;
      border-color: var(--gold);
    }
    /* Сцена концовки */
    #scene { position: fixed; inset: 0; z-index: 15; pointer-events: none; }

    /* Кодекс форм */
    #codex {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(11, 8, 5, 0.92);
      z-index: 20;
      padding: 16px;
    }
    #codex.show { display: flex; }
    .codexpanel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 20px;
      width: min(640px, 94vw);
      max-height: 90vh;
      overflow-y: auto;
      text-align: center;
    }
    .codexpanel h2 {
      font-variant: small-caps;
      letter-spacing: 0.15em;
      color: var(--gold);
      margin-bottom: 12px;
    }
    .codexgrid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 10px;
    }
    .codexcard {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--gold);
    }
    .codexcard small { color: var(--ochre); font-size: 10px; line-height: 1.3; }
    .codexcard.unknown { opacity: 0.55; }
    .codexbtn {
      margin-top: 10px;
      border-radius: 8px;
      font-size: 13px;
      padding: 8px 16px;
    }

    .sharerow { display: flex; gap: 10px; justify-content: center; margin-top: 8px; }
    .sharerow button { border-radius: 8px; font-size: 13px; padding: 9px 14px; }
    .seedrow button { border-radius: 8px; font-size: 13px; padding: 9px 12px; }

    /* Таблички Судеб */
    .tablettitle {
      text-align: center;
      color: var(--ochre);
      font-variant: small-caps;
      letter-spacing: 0.15em;
      font-size: 14px;
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid var(--line);
    }
    .tabletlocked { font-size: 12px; color: var(--ochre); text-align: center; padding: 6px 0; }
    .tabletrow {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
      padding: 8px 0 4px;
      font-size: 13px;
    }
    .tabletrow select {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--line);
      color: var(--gold);
      font-family: inherit;
      font-size: 13px;
      padding: 8px 6px;
      border-radius: 8px;
      max-width: 100%;
    }
    .carvebtn {
      display: block;
      margin: 6px auto;
      border-radius: 8px;
      font-size: 13px;
      padding: 9px 16px;
    }
    .tabletlist { padding: 4px 0; font-size: 12px; color: var(--text); }
    .tabletitem { padding: 3px 0; }
    .tabletitem.fired { color: var(--turquoise); }

    /* Телефон: компактнее кнопки и статистика */
    @media (max-width: 520px) {
      #stats { font-size: 11px; gap: 4px 10px; padding: 4px 10px; }
      .iconbtn { width: 40px; height: 40px; font-size: 17px; }
      #sidebtns { gap: 6px; }
      #title { display: none; }
      #stats { max-width: 96vw; }
      #mepanel { max-height: 52vh; }
      .me-row label { flex-basis: 8em; font-size: 12px; }
    }
    @media (max-height: 600px) {
      .iconbtn { width: 36px; height: 36px; font-size: 15px; }
      #sidebtns { gap: 5px; }
    }

    /* Нижняя панель Ме */
    #mepanel {
      position: fixed;
      left: 50%;
      bottom: 0;
      transform: translate(-50%, 0);
      width: min(560px, calc(100vw - 16px));
      background: var(--panel);
      border: 1px solid var(--line);
      border-bottom: none;
      border-radius: 14px 14px 0 0;
      padding: 10px 16px 14px;
      transition: transform 0.25s ease;
      backdrop-filter: blur(3px);
    }
    #mepanel.hidden { transform: translate(-50%, calc(100% - 38px - env(safe-area-inset-bottom, 0px))); }
    #mepanel {
      max-height: 60vh;
      overflow-y: auto;
      padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    }
    #mehandle {
      width: 100%;
      background: none;
      border: none;
      color: var(--ochre);
      font-size: 14px;
      font-variant: small-caps;
      letter-spacing: 0.15em;
      padding: 2px 0 10px;
    }
    #mehandle:hover { color: var(--gold); }
    .me-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px 0;
    }
    .me-row label {
      flex: 0 0 9.5em;
      font-size: 13px;
      color: var(--text);
    }
    .me-row output {
      flex: 0 0 2em;
      text-align: right;
      font-size: 14px;
      font-weight: bold;
      color: var(--turquoise);
    }
    input[type="range"] {
      flex: 1;
      height: 28px;
      accent-color: var(--ochre);
      cursor: pointer;
    }
    #merow-buttons {
      display: flex;
      gap: 10px;
      justify-content: center;
      padding-top: 8px;
    }
    #merow-buttons button {
      border-radius: 8px;
      font-size: 13px;
      padding: 8px 18px;
    }
  </style>
</head>
<body>
  <canvas id="field"></canvas>
  <div id="topbar">
    <div id="title">MONAS VIVENS</div>
    <div id="stats"></div>
  </div>
  <div id="lensbtns"></div>
  <div id="sidebtns"></div>
  <div id="mepanel"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
